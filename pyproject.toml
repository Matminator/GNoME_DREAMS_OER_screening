[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GNoME_DREAMS_OER_screening"
version = "0.1.0"
description = "TEMP"
authors = [
    {name = "Mathias"},
    {name = "Ziqi"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymatgen", "ase", "pandas", "numpy", "seaborn", "custodian", 
    "pytest>=7", "executorlib"
]

# [project.optional-dependencies]


[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/Matminator/GNoME_DREAMS_OER_screening"


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]