[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GNoME_DREAMS_OER_screening"
version = "0.5.4"
description = "TEMP"
authors = [
    {name = "Mathias"},
    {name = "Ziqi"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymatgen", "spglib", "ase", "pandas", "numpy", "seaborn", "custodian",
    "pytest>=7", "pysqa", "mace-torch"
]
# NOTE: magnetic structure enumeration also requires the 'enumlib' Fortran
# binaries (enum.x, makestr.x) on PATH. These cannot be installed via pip.
# On Linux/HPC: conda install -c conda-forge enumlib
# Source: https://github.com/msg-byu/enumlib
# Without enumlib, enumerate_magnetic_structures falls back to a single NM job.

# [project.optional-dependencies]


[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/Matminator/GNoME_DREAMS_OER_screening"


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

filterwarnings = [
    "ignore:Set OLD_ERROR_HANDLING to false:DeprecationWarning:spglib.*"
]

markers = [
    "mini: marks fast tests for quick runs",
    "enumlib: marks tests that require enumlib binaries on PATH (Linux/HPC only)",
]
